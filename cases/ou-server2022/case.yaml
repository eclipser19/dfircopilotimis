# Open University ORDO dataset "Compromised Windows Server 2022 (simulation)" (B. Donnachie; data
# synthetic: users, IPs). Disk image only (E01). Benchmark; there is no published solution, so the
# key was built from a blind run's cited records and Hayabusa hits. Setup and key: answer_key.md.

case:
  name: "Compromised Windows Server 2022 (OU simulation)"
  analyst: "Investigator"
  created: "2026-10-15"

velociraptor:
  client_id: ""                     # the dead-disk client reading the E01 (C.xxxx)
  collection_wait_seconds: 300

scope:
  # The office network ran from September 2023; the ransomware was found on 12 February 2024.
  start_time: "2023-09-01T00:00:00Z"
  end_time: "2024-02-13T00:00:00Z"
  clock_offset_minutes: 0
  description: >
    Simulated UK-based small office network running from September 2023 to February 2024 (all
    names and IP addresses synthetic). The administrator opened RDP to facilitate working from
    home. On 12 February 2024 the server was found no longer responding, with 'Red Petya'
    ransomware displayed on the screen. Forensic experts decrypted the disk and imaged it.
    Determine what happened before, immediately before, on and after 12 February 2024: how the
    ransomware got onto the system, which vulnerabilities and accounts were used, whether data was
    taken, which identifiers (source IPs, user names, file hashes) and TTPs can be found, and the
    server's OS version, patch level, services and password weaknesses.

iocs:
  hashes: []
  ips: []
  domains: []
  filenames: []
  users: []

# Triage collected before the agent starts (no LLM). Same list as the other intrusion benchmarks.
collect:
  - Generic.Client.Info
  - Windows.EventLogs.RDPAuth
  - Windows.Sys.StartupItems
  - Windows.Timeline.Prefetch
  - Windows.System.TaskScheduler
  - artifact: Windows.EventLogs.EvtxHunter
    parameters:
      IocRegex: "."
      IdRegex: "^(4624|4625|4634|4647|4648|4688|4697|4698|4702|4720|4722|4724|4726|4728|4732|4756|4781|7045|1102|104|1116|1117|5001|1149|21|22|23|24|25)$"
  # Cheap file-system sources every question used to collect again by itself.
  - Windows.Forensics.Amcache          # executables present, with SHA1
  - Windows.Analysis.EvidenceOfDownload  # Zone.Identifier: download URLs
  - Windows.Forensics.Lnk              # files and folders opened, per user
  - Windows.Forensics.RecycleBin       # deleted files with their original paths
  - Windows.Forensics.SAM              # local accounts: created, last logon, logon count
  # Files in the users' folders, each file's type from its first bytes (copilot/knowledge_data/file_types.yaml)
  - artifact: Windows.Search.FileFinder
    parameters:
      SearchFilesGlobTable: [C:/Users/*/Desktop/**, C:/Users/*/Documents/**, C:/Users/*/Downloads/**,
                             C:/Users/*/Pictures/**, C:/Users/*/Videos/**, C:/Users/*/Music/**, C:/Users/*/OneDrive/**]
  - artifact: Generic.Detection.Yara.Glob
    parameters:
      PathGlob: C:/Users/*/{Desktop,Documents,Downloads,Pictures,Videos,Music,OneDrive}/**
      YaraRule: "@file_types"
      SizeMax: 50000000
  - artifact: Windows.Forensics.Usn  # archives and disk images created, renamed or deleted
    parameters:
      FileNameRegex: '(?i)\.(zip|7z|rar|tar|gz|tgz|bz2|xz|iso|img|vhdx?)$'

collection:
  # An RDP server open to the internet for months logs a lot of failed logons: 50,000 rows were not
  # enough for the event-log triage over this window (Velociraptor cancels a collection past the limit).
  max_rows: 300000
  apply_time_window: true
  agent_collections: confirm

output:
  report_formats: [html]

agent:
  approvals:
    retract_finding: confirm
    update_case: confirm
    switch_case: confirm
    create_case: confirm
    memory: confirm
  allow_raw_vql: false
  max_steps: 20
  max_tokens_per_turn: 300000
