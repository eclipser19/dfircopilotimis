# DFIR Madness Case 001 — "The Stolen Szechuan Sauce", Desktop image.
# Blind run: only what the victim told us at the start. The answers are in
# answer_key.md, which the agent never sees; use it to grade the report.
#
# Use with:  $env:DFIR_CASE_FILE = "cases\szechuan\case.yaml"; python main.py

case:
  name: "Case 001 - Stolen Szechuan Sauce (Desktop)"
  analyst: "Investigator"
  created: "2026-10-06"

velociraptor:
  client_id: "C.9df7df3cb9ef3ac1"   # the dead-disk client now reading the Desktop E01
  collection_wait_seconds: 300      # image collections take longer than live ones

# What the disk image is, for the report's evidence section (all optional; also editable in
# the app under Case settings). Hashes as published by the image's provider or your own.
# evidence:
#   image_name: <the E01 file name>
#   image_sha256: <64 hex characters>
#   image_md5: <32 hex characters>
#   acquired: <when the image was taken, ISO 8601>
#   notes: <who acquired it, how it reached you>
# A case that holds data from its client or memory image keeps them: they can't be changed to
# point at other evidence (create a new case for that).

scope:
  # The client noticed on 19 Sep 2020; a day either side covers the run-up and aftermath.
  start_time: "2020-09-18T00:00:00Z"
  end_time: "2020-09-20T00:00:00Z"
  # Host clock ran 60 minutes ahead of true UTC: recorded 03:35:54 = real 02:35:54.
  clock_offset_minutes: 60
  description: >
    The client's secret Szechuan sauce recipe was found for sale on the dark web.
    They suspect a breach of their small network (domain C137 / CITADEL): a domain
    controller CITADEL-DC01 (10.42.85.10, Windows Server 2012) and one workstation
    DESKTOP-SDN1RPT (10.42.85.115, Windows 10). This image is the workstation.
    Determine whether it was compromised, how, when, by whom, what ran, what
    persisted, and what data was accessed or taken.
    Clock warning from the client: the machines' time zone was set incorrectly
    (UTC-7 instead of UTC-6), so their clocks ran one hour ahead of true UTC
    (confirmed against the network capture). See clock_offset_minutes.

# Blind run: no IOCs. For a second, guided run, uncomment the attacker IP only.
iocs:
  hashes: []
  ips: []           # guided run: ["194.61.24.102"]
  domains: []
  filenames: []
  users: []

# Auto-collected before the agent starts (costs no LLM tokens). Entries are an artifact
# name, or {artifact, parameters}. The scope window is added to date parameters automatically.
# Avoid live-only artifacts (WMI/process based, e.g. Windows.System.Services): they return
# nothing from a disk image.
collect:
  - Generic.Client.Info
  - Windows.EventLogs.RDPAuth          # RDP / logon activity
  - Windows.Sys.StartupItems           # Run keys / startup folders
  - Windows.Timeline.Prefetch          # program execution
  - Windows.System.TaskScheduler       # scheduled tasks
  - artifact: Windows.EventLogs.EvtxHunter   # key event IDs only: logons, service installs,
    parameters:                              # process creation, tasks, log clearing
      IocRegex: "."
      IdRegex: "^(4624|4625|4634|4647|4648|4688|4697|4698|4702|4720|4722|4724|4726|4728|4732|4756|4781|7045|1102|104|1116|1117|5001|1149|21|22|23|24|25)$"

# Memory image of the same desktop (Volatility 3; see server.yaml memory:). Pick it in the app
# (Case settings > Memory image) or write its file name here, as it is in memory.images_dir.
# The answer key has the C2 (203.78.103.109) and the migration into spoolsv.exe in memory.
memory:
  image: DESKTOP-SDN1RPT.mem      # the desktop's RAM capture (2.0 GB), Windows 10 build 19041
  os: windows
  # Memory triage (default when left out: info, pslist, psscan, pstree, cmdline, netscan, svcscan, malfind)
  # collect: [windows.info, windows.pslist, windows.psscan, windows.pstree, windows.cmdline,
  #           windows.netscan, windows.svcscan, windows.malfind]

# Collection limits (apply to every collection, investigator's or agent's).
collection:
  max_rows: 50000            # rows per collection; results beyond are dropped and flagged as truncated
  apply_time_window: true    # pass scope start/end into artifacts' own date filters (DateAfter/DateBefore...)
  agent_collections: confirm # confirm: you approve each agent request (y/n) | auto | off

# Report files and where outputs go. Formats cost no extra LLM tokens (one narrative,
# converted locally); list only what you want to keep.
output:
  report_formats: [html]   # html, md, or both: [html, md]
  # dir: /uploads          # default: data/outputs in this case's folder

agent:
  # What the agent may do on its own. confirm: you approve each request (default) | auto | off.
  # Collections use collection.agent_collections above.
  approvals:
    retract_finding: confirm
    update_case: confirm
    switch_case: confirm
    create_case: confirm
    memory: confirm          # Volatility runs the agent asks for (the memory triage needs no approval)
  allow_raw_vql: false
  max_steps: 20
  max_tokens_per_turn: 300000
