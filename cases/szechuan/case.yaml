# DFIR Madness Case 001 — "The Stolen Szechuan Sauce", Desktop image.
# Blind run: only what the victim told us at the start. The answers are in
# answer_key.md, which the agent never sees; use it to grade the report.
#
# Use with:  $env:DFIR_CASE_FILE = "cases\szechuan\case.yaml"; python main.py

case:
  name: "Case 001 - Stolen Szechuan Sauce (Desktop)"
  analyst: "Investigator"
  created: "2026-10-06"

velociraptor:
  client_id: "C.9df7df3cb9ef3ac1"   # the dead-disk client now reading the Desktop E01
  collection_wait_seconds: 300      # image collections take longer than live ones

scope:
  # The client noticed on 19 Sep 2020; a day either side covers the run-up and aftermath.
  start_time: "2020-09-18T00:00:00Z"
  end_time: "2020-09-20T00:00:00Z"
  description: >
    The client's secret Szechuan sauce recipe was found for sale on the dark web.
    They suspect a breach of their small network (domain C137 / CITADEL): a domain
    controller CITADEL-DC01 (10.42.85.10, Windows Server 2012) and one workstation
    DESKTOP-SDN1RPT (10.42.85.115, Windows 10). This image is the workstation.
    Determine whether it was compromised, how, when, by whom, what ran, what
    persisted, and what data was accessed or taken.
    Clock warning from the client: the machines' time zone was set incorrectly
    (UTC-7, should be UTC-6). Prefer timestamps stored in UTC (event logs, NTFS)
    and flag any conclusion that relies on local-time values.

# Blind run: no IOCs. For a second, guided run, uncomment the attacker IP only.
iocs:
  hashes: []
  ips: []           # guided run: ["194.61.24.102"]
  domains: []
  filenames: []
  users: []

# Auto-collected before the agent starts (costs no LLM tokens).
collect:
  - Generic.Client.Info
  - Windows.EventLogs.RDPAuth          # RDP / logon activity
  - Windows.System.Services            # installed services
  - Windows.Sys.StartupItems           # Run keys / startup folders
  - Windows.Timeline.Prefetch          # program execution
  - Windows.System.TaskScheduler       # scheduled tasks

agent:
  allow_raw_vql: false
  max_steps: 15
  max_tokens_per_turn: 300000
