# DFIR Copilot server settings. Copy to server.yaml (git-ignored) and edit.
# Environment variables, when set, win over this file (DFIR_LLM_MODEL etc.).
# The app re-reads the file when it changes: reload the page after editing.

llm:
  # --- Cloud model (the default) ---
  base_url: https://tag-news-resource.services.ai.azure.com/openai/v1
  model: gpt-5.6-luna
  # API key for the cloud endpoint. Leave empty to have each investigator enter their own
  # in the sidebar. Never commit a filled-in server.yaml.
  api_key: ""

  # --- Local model instead (no key, no internet) ---
  # base_url: http://localhost:11434/v1     # Ollama; vLLM / LM Studio / llama.cpp work too
  # model: <model name>                     # must support tool calling
  # timeout: 900                            # seconds per call; local models can be slow
  # local: true                             # only needed for a host that isn't localhost,
  #                                         # a private IP or a .local name

login:
  # Refuse to run without accounts (python -m copilot.auth add <username> --admin).
  required: true

memory:
  # Memory analysis with Volatility 3. Install it once, with the Python that runs the copilot:
  #     pip install volatility3
  # Then check the setup (version, images, symbols, offline) with:
  #     python -m copilot.memory check                  (add an image name to test reading it)

  # 1. The folder with the memory images (.mem, .raw, .vmem, .dmp...). Each case picks its image
  #    from this folder in the app (Case settings > Memory image). Nothing outside it can be opened.
  images_dir: 'C:\dfir\memory'

  # 2. A FOLDER for symbol tables (created if missing). Volatility needs the table of the image's
  #    exact Windows kernel to read it. It looks here first and saves tables it downloads here, as
  #    <this folder>\windows\ntkrnlmp.pdb\<ID>.json.xz. So give the folder that holds "windows",
  #    never the .json.xz file or the windows folder itself.
  symbols_dir: 'C:\dfir\symbols'

  # 3. Offline. true = Volatility never goes online; each image's table must already be in
  #    symbols_dir (or in Volatility's own symbols folder). Ways to get a table there:
  #    a) Online once: set offline: false while the server has internet and run
  #         python -m copilot.memory check <image name>
  #       Volatility downloads the table from Microsoft into symbols_dir. Set offline: true again;
  #       that image now works offline.
  #    b) Copy it from a PC that already read the image: `windows.info` shows it as "Symbols"
  #       (...\volatility3\symbols\windows\ntkrnlmp.pdb\<ID>.json.xz). Copy that windows folder
  #       into symbols_dir, keeping the sub-folders, e.g. in PowerShell:
  #         Copy-Item -Recurse "<...>\volatility3\symbols\windows" 'C:\dfir\symbols\'
  #       (On the PC that downloaded it nothing is needed: Volatility's own symbols folder is
  #       always searched as well.)
  #    c) The symbol pack, for many Windows builds at once: on a PC with internet download
  #         https://downloads.volatilityfoundation.org/volatility3/symbols/windows.zip
  #       and put windows.zip into symbols_dir as it is (no need to unzip). Not every build is in it;
  #       use a) or b) for the ones that are missing.
  offline: true

  # Seconds one plugin may run before it is stopped.
  timeout: 3600
