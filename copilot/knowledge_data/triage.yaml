# Triage suggestions for disk images: offered first (⭐) in the app's triage picker.
# All read files, registry or event logs, so they work on a dead-disk image. Names must exist
# on your Velociraptor server: the picker hides the ones it doesn't have.
#
#   artifact     exact Velociraptor artifact name
#   why          one line shown in the picker
#   parameters   used when the artifact is added to the triage without parameters of its own

windows:
  - artifact: Generic.Client.Info
    why: Host name, OS and users
  - artifact: Windows.EventLogs.RDPAuth
    why: RDP and interactive logons, with source IPs
  - artifact: Windows.EventLogs.EvtxHunter
    why: 'Key event IDs: logons, account and group changes, services, tasks, process creation, log clearing, Defender'
    parameters:
      IocRegex: "."
      IdRegex: "^(4624|4625|4634|4647|4648|4688|4697|4698|4702|4720|4722|4724|4726|4728|4732|4756|4781|7045|1102|104|1116|1117|5001|1149|21|22|23|24|25)$"
  - artifact: Windows.EventLogs.PowershellScriptblock
    why: PowerShell code that ran (4104), decoded stages included
  - artifact: Windows.Sys.StartupItems
    why: Run keys and Startup folders (persistence)
  - artifact: Windows.System.TaskScheduler
    why: Scheduled tasks (persistence)
  - artifact: Windows.Timeline.Prefetch
    why: Program execution with run times
  - artifact: Windows.Forensics.Amcache
    why: Executables present on the system, with SHA1
  - artifact: Windows.Registry.AppCompatCache
    why: ShimCache, executables seen by the system
  - artifact: Windows.Forensics.Bam
    why: Last execution per user (Background Activity Moderator)
  - artifact: Windows.Forensics.SAM
    why: Local accounts with creation time, last logon and logon count
  - artifact: Windows.Registry.UserAssist
    why: GUI programs each user ran, with counts
  - artifact: Windows.Registry.RecentDocs
    why: Documents each user opened recently
  - artifact: Windows.Forensics.Lnk
    why: Shortcuts to opened files, with target paths and times
  - artifact: Windows.Forensics.Shellbags
    why: Folders each user browsed
  - artifact: Windows.Forensics.RecycleBin
    why: Deleted files in the Recycle Bin
  - artifact: Windows.Forensics.SRUM
    why: Per-application network and resource usage
  - artifact: Windows.Analysis.EvidenceOfDownload
    why: Downloaded files in Downloads and the Recycle Bin, with the source URL (Zone.Identifier)
  - artifact: Windows.Search.FileFinder
    why: Every file in the users' Desktop, Documents, Downloads, Pictures, Videos, Music and OneDrive folders
    parameters:
      SearchFilesGlobTable: [C:/Users/*/Desktop/**, C:/Users/*/Documents/**, C:/Users/*/Downloads/**,
                             C:/Users/*/Pictures/**, C:/Users/*/Videos/**, C:/Users/*/Music/**, C:/Users/*/OneDrive/**]
  - artifact: Generic.Detection.Yara.Glob
    why: "Each file's type from its first bytes in those folders (finds archives or programs under another name; reads files up to 50 MB)"
    parameters:
      PathGlob: C:/Users/*/{Desktop,Documents,Downloads,Pictures,Videos,Music,OneDrive}/**
      YaraRule: "@file_types"
      SizeMax: 50000000
  - artifact: Windows.Forensics.Usn
    why: Archives and disk images created, renamed or deleted, even when gone (clear FileNameRegex for the whole journal, which is very large)
    parameters:
      FileNameRegex: '(?i)\.(zip|7z|rar|tar|gz|tgz|bz2|xz|iso|img|vhdx?)$'
  - artifact: Windows.NTFS.MFT
    why: Every file with its MACB times (large; capped at the row limit)

linux:
  - artifact: Generic.Client.Info
    why: Host name, OS and users
  - artifact: Linux.Sys.Users
    why: Local accounts
  - artifact: Linux.Sys.LastUserLogin
    why: Logins (wtmp)
  - artifact: Linux.Syslog.SSHLogin
    why: SSH logins from the auth logs
  - artifact: Linux.Ssh.AuthorizedKeys
    why: SSH keys allowed to log in (persistence)
  - artifact: Linux.Sys.Crontab
    why: Cron jobs (persistence)
  - artifact: Linux.Sys.BashHistory
    why: Shell command history per user
