# Artifact reference. Matched by `pattern` (case-insensitive glob), FIRST match wins:
# keep specific patterns above general ones.
#
# Fields:
#   what / location / meaning   shown in the report and to the agent
#   tips                        how to use it well (shown by describe_artifact)
#   params                      parameter names VERIFIED against a real Velociraptor run
#   live_only: true             needs a running system (WMI, processes, network); refused on disk images
#   dead_disk_note              caveat when it partly works on images
#
# Add your own entries freely; no code changes needed.

# ---------------------------------------------------------------- event logs
- pattern: Windows.EventLogs.RDPAuth*
  what: Remote Desktop and logon events
  location: 'C:\Windows\System32\winevt\Logs\Security.evtx (4624/4625/4634/4647/4778/4779), TerminalServices-RemoteConnectionManager (1149), TerminalServices-LocalSessionManager (21-25)'
  meaning: Who logged on interactively or over RDP, from which IP/host, when, and when they left.
  params: {DateAfter: start of window, DateBefore: end of window}

- pattern: Windows.EventLogs.PowershellScriptblock*
  what: PowerShell script block logging (4104)
  location: 'C:\Windows\System32\winevt\Logs\Microsoft-Windows-PowerShell%4Operational.evtx'
  meaning: The PowerShell code that actually ran, including decoded/deobfuscated stages.

- pattern: Windows.EventLogs.EvtxHunter*
  what: Search across all Windows event logs
  location: 'C:\Windows\System32\winevt\Logs\*.evtx'
  meaning: 'Any event by ID or content: e.g. 7045 service installed, 4688 process created, 4698 task created, 1102/104 logs cleared, 4104 PowerShell code.'
  params:
    IdRegex: regex on the event ID
    IocRegex: regex on the event content
    DateAfter: start of window
    DateBefore: end of window
  tips:
    - 'Anchor IdRegex (e.g. ^(7045|4624)$) so 7045 does not also match 17045.'
    - "IocRegex matches event content; use '.' to keep every event of the selected IDs."
    - Event IDs repeat across logs (21 and 104 mean different things in different channels); check the Channel.

- pattern: Windows.EventLogs.*
  what: Windows event log records
  location: 'C:\Windows\System32\winevt\Logs\*.evtx'
  meaning: System, security and application activity recorded by Windows.

# ---------------------------------------------------------------- execution
- pattern: Windows.Timeline.Prefetch*
  what: Prefetch execution history
  location: 'C:\Windows\Prefetch\*.pf'
  meaning: 'A program ran: executable name, run count and up to 8 last run times (Windows 8+). Proves execution even if the binary was deleted.'
  params: {dateAfter: start of window (lowercase d), dateBefore: end of window}
  tips:
    - Prefetch is often disabled on servers and SSD-backed VMs; absence is not proof of non-execution.

- pattern: Windows.Forensics.Prefetch*
  what: Prefetch files (parsed)
  location: 'C:\Windows\Prefetch\*.pf'
  meaning: Program execution, run count, last run times and files/directories loaded by the program.

- pattern: '*Amcache*'
  what: Amcache inventory
  location: 'C:\Windows\AppCompat\Programs\Amcache.hve'
  meaning: Executables present or installed, with SHA1 hashes and paths. On Windows 10 it shows presence and first-seen time, not reliable proof of execution on its own.

- pattern: '*AppCompatCache*'
  what: ShimCache (AppCompatCache)
  location: 'SYSTEM hive: ControlSet00x\Control\Session Manager\AppCompatCache'
  meaning: Executables the system saw, with their file modification time. On Windows 10 an entry shows presence, not execution; entries are only written at shutdown.

- pattern: '*Shimcache*'
  what: ShimCache (AppCompatCache)
  location: 'SYSTEM hive: ControlSet00x\Control\Session Manager\AppCompatCache'
  meaning: Executables the system saw, with their file modification time. Presence, not proof of execution, on Windows 10.

- pattern: Windows.Forensics.Bam*
  what: Background Activity Moderator
  location: 'SYSTEM hive: ControlSet00x\Services\bam\State\UserSettings\<SID>'
  meaning: Last execution time of programs per user (Windows 10 1709+).

- pattern: Windows.Registry.UserAssist*
  what: UserAssist
  location: 'NTUSER.DAT: Software\Microsoft\Windows\CurrentVersion\Explorer\UserAssist'
  meaning: GUI programs a user launched, with run count and last run time (names are ROT13-encoded in the hive).

- pattern: Windows.Forensics.SRUM*
  what: System Resource Usage Monitor
  location: 'C:\Windows\System32\sru\SRUDB.dat'
  meaning: Per-application resource and network usage (bytes sent/received) per hour for about 30 days; useful to spot exfiltration volume.

- pattern: Windows.System.Powershell.PSReadline*
  what: PowerShell console history
  location: 'C:\Users\*\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
  meaning: Commands typed in interactive PowerShell consoles. No timestamps; correlate with logon sessions.
  params: {SearchStrings: regex filter on lines, UserRegex: user filter, UploadFiles: Y/N}

# ---------------------------------------------------------------- file system
- pattern: Windows.NTFS.MFT*
  what: NTFS Master File Table
  location: 'C:\$MFT'
  meaning: Which files exist(ed), their full paths, sizes and MACB times ($STANDARD_INFORMATION 0x10 and $FILE_NAME 0x30). Entries of deleted files survive until reused.
  params:
    FileRegex: regex on the file NAME only
    PathRegex: regex on the folder path
    AllNtfs: Y to scan every NTFS volume
    MFTDrive: 'drive to scan, e.g. C:'
    DateAfter: start of window
    DateBefore: end of window
  tips:
    - FileRegex matches the file NAME only; to search a folder use PathRegex.
    - 'DateAfter/DateBefore filter on timestamps: when hunting a known file name, drop them so older or timestomped entries are not excluded.'
    - 0x10 ($SI) times can be timestomped; compare with 0x30 ($FN). $SI created earlier than $FN created is a classic timestomping sign.

- pattern: '*Usn*'
  what: NTFS USN change journal
  location: 'C:\$Extend\$UsnJrnl:$J'
  meaning: 'File creations, renames and deletions with times, even after the file is gone: the best source to prove a file (e.g. an archive) was created, renamed and deleted.'
  params: {FileNameRegex: regex on the file name, DateAfter: start of window, DateBefore: end of window}
  tips:
    - Several rows per operation are normal (one per reason flag, e.g. FILE_CREATE then CLOSE).
    - The journal rolls over; on busy systems it may only cover days.

- pattern: Windows.Forensics.Lnk*
  what: Shortcut (LNK) files
  location: 'C:\Users\*\AppData\Roaming\Microsoft\Windows\Recent\*.lnk'
  meaning: Files and folders a user opened, with target path, target times and volume/network origin; survives deletion of the target.

- pattern: '*JumpList*'
  what: Jump Lists
  location: 'C:\Users\*\AppData\Roaming\Microsoft\Windows\Recent\AutomaticDestinations, CustomDestinations'
  meaning: Files recently opened per application (e.g. which documents, which RDP hosts in mstsc).

- pattern: '*Shellbag*'
  what: Shellbags
  location: 'NTUSER.DAT and UsrClass.dat: Software\Microsoft\Windows\Shell\BagMRU'
  meaning: Folders a user browsed in Explorer, including removable media and network shares, even after deletion.

- pattern: '*RecycleBin*'
  what: Recycle Bin
  location: 'C:\$Recycle.Bin\<SID>\$I*, $R*'
  meaning: Files a user deleted through Explorer, original path and deletion time.

# ---------------------------------------------------------------- persistence
- pattern: Windows.Sys.StartupItems*
  what: Autostart entries
  location: 'HKLM/HKCU\Software\Microsoft\Windows\CurrentVersion\Run, RunOnce; Startup folders'
  meaning: 'Programs or commands started at every logon: a common persistence mechanism. Entries carry no timestamp of their own (the key LastWrite time can date them).'

- pattern: Windows.System.TaskScheduler*
  what: Scheduled tasks
  location: 'C:\Windows\System32\Tasks\**'
  meaning: Tasks that run programs on a schedule or trigger; persistence and execution. Pair with Security 4698 or TaskScheduler/Operational 106 for creation time.

- pattern: Windows.Persistence.PermanentWMIEvents*
  what: WMI event subscriptions
  location: 'C:\Windows\System32\wbem\Repository\OBJECTS.DATA'
  meaning: Permanent WMI consumers that run code on a trigger; stealthy persistence.
  dead_disk_note: The live variant queries WMI; on images only repository-parsing artifacts work.

- pattern: Windows.System.Services*
  what: Installed services (live system only)
  location: WMI on a running system
  meaning: Does not work on disk images; use event 7045 (System log) or the SYSTEM hive (ControlSet00x\Services) instead.
  live_only: true

# ---------------------------------------------------------------- registry, apps, system
- pattern: Windows.Registry.*
  what: Registry data
  location: 'C:\Windows\System32\config\{SYSTEM,SOFTWARE,SAM,SECURITY}, C:\Users\*\NTUSER.DAT, UsrClass.dat'
  meaning: System and user configuration, persistence keys and user activity traces.

- pattern: Windows.Applications.*
  what: Application artifacts (browsers etc.)
  location: 'Per-application profile folders under C:\Users\*'
  meaning: Browsing and download history.
  dead_disk_note: Several of these call live-only functions (e.g. lookupSID) and return nothing from a disk image.
  params: {userRegex: user filter (Firefox artifacts), URLRegex: URL filter (Firefox artifacts)}

- pattern: Windows.Network.*
  what: Network state (live system only)
  location: Running system
  meaning: Connections, listening ports, ARP cache at collection time; meaningless for a disk image.
  live_only: true

- pattern: Windows.System.Pslist*
  what: Running processes (live system only)
  location: Running system
  meaning: Processes at collection time; meaningless for a disk image.
  live_only: true

- pattern: Windows.Memory.*
  what: Memory analysis (live system only)
  location: Running system memory
  meaning: Needs live memory, not a disk image.
  live_only: true

- pattern: Generic.Client.Info*
  what: System information
  location: Collected by Velociraptor from the image
  meaning: Hostname, OS version, users. Timestamps in BasicInformation describe the collection, not the incident.

# ---------------------------------------------------------------- Linux
- pattern: Linux.Sys.Users*
  what: Local users
  location: /etc/passwd
  meaning: Accounts present on the system.

- pattern: Linux.Sys.LastUserLogin*
  what: Login records
  location: /var/log/wtmp
  meaning: Interactive logins and their source host.

- pattern: Linux.Syslog.SSHLogin*
  what: SSH logins
  location: /var/log/auth.log, /var/log/secure
  meaning: Who logged in over SSH, from where and when (successes and failures).

- pattern: Linux.Sys.BashHistory*
  what: Shell history
  location: '~/.bash_history'
  meaning: Commands typed by users. Usually no timestamps unless HISTTIMEFORMAT was set.

- pattern: Linux.Sys.Crontab*
  what: Cron jobs
  location: /etc/crontab, /etc/cron.*, /var/spool/cron
  meaning: Scheduled commands; common persistence.

- pattern: Linux.Ssh.AuthorizedKeys*
  what: SSH authorized keys
  location: '~/.ssh/authorized_keys'
  meaning: Keys allowed to log in without a password; attackers add their own for persistence.

- pattern: Linux.Forensics.Journal*
  what: systemd journal
  location: /var/log/journal
  meaning: System and service log messages.
