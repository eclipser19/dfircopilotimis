# Windows event ID reference. `channel` is matched case-insensitively as a substring of
# the record's Channel/Provider; IDs that repeat across logs are told apart by it.
# An ID with a single entry is used even when the channel is unknown.

- {id: 4624, channel: Security, meaning: Successful logon, details: 'Check LogonType: 2 interactive, 3 network (SMB, PsExec), 4 batch, 5 service, 7 unlock, 8 network cleartext, 9 new credentials (runas /netonly), 10 RemoteInteractive (RDP), 11 cached interactive. IpAddress/WorkstationName show the source.'}
- {id: 4625, channel: Security, meaning: Failed logon, details: 'Bursts from one IP indicate brute force; Status/SubStatus give the reason (e.g. 0xC000006A bad password).'}
