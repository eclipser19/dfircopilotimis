# Investigation playbooks: for a question, which sources to check and what to look for.
# Shown to the agent by the dfir_guide tool, and attached automatically to an investigator's
# question that matches one of its `triggers` (regular expressions, case-insensitive; the best
# two playbooks are attached). Event IDs refer to event_ids.yaml.

initial_access:
  question: How did the attacker first get in?
  triggers: ['get(ting)? (on)?to\b', 'got (on)?to\b', '\bget in\b', '\bgot in\b', 'initial access', 'entry point', 'deliver', 'download', 'dropped', 'c[ao]me from', 'arriv', 'how did .* get', 'put on', 'origin', 'where .* from']
  check:
    - 'Security 4625 bursts from one IP followed by 4624 from the same IP: brute force (RDP: LogonType 10, often preceded by 1149). Read the source IP and workstation name in the 4624 itself: failures from one IP and a success from another are two separate facts, and a success from an address that also logs on at office hours on other days is likely the real user.'
    - 'RDP with Network Level Authentication logs failed logons as 4625 type 3 with NO source address, only the client''s workstation name. logon_summary lists them under that workstation name: tie them to an address by the same workstation name on a successful logon (4624 type 3 just before the type 10 RDP logon) and by the timing, and say that this is how they were tied.'
    - 'The intrusion starts at the first successful logon tied to the attacker (its own source IP, workstation name, or the same Logon ID doing what followed: accounts, tools, tasks), not at the first logon of the account.'
    - 'RDP from external IPs: 4624 type 10, RemoteConnectionManager 1149, LocalSessionManager 21/22.'
    - 'Before writing that the delivery method cannot be determined, check the download evidence below and the parent process of the first execution (memory pslist PPID, Prefetch of the parent).'
    - 'Download SOURCE, cheapest first, and stop looking for the source when one gives the URL (then still get the TIME, next point): (1) Windows.Analysis.EvidenceOfDownload with the payload''s path in DirectoryPathGlob (where it was downloaded AND where it is now): its Zone.Identifier HostUrl is the download URL. (2) No HostUrl and the case has a memory image: right away, before other searches, analyze_memory strings with "Visited: " (pages visited with Internet Explorer / Edge Legacy, with the user and URL) and strings with the payload''s file name (a URL or HTTP request around it). Never strings a bare "http" (too many hits). (3) The history artifact of the browser that ran just before the payload (Prefetch: IEXPLORE.EXE, MSEDGE.EXE, CHROME.EXE, FIREFOX.EXE) if it works on images (dfir_guide on the artifact); IE and Edge Legacy (MicrosoftEdge.exe) keep history in WebCacheV01.dat, which has no parser artifact.'
    - 'A URL found in memory proves the source when it names the payload, or when the same user visited that host just before the download time: quote it with its evidence ID as the source.'
    - 'Download TIME, always, also when memory gave the source: the USN journal for the file name (Windows.Forensics.Usn with FileNameRegex) shows the temporary download name being created (start) and renamed to the final name (end); the first execution (Prefetch) comes after. Report that, not just the browser''s running time.'
    - 'URLs typed into Internet Explorer: Windows.Registry.NTUser with KeyGlob Software\Microsoft\Internet Explorer\TypedURLs* (works on images).'
    - Email attachments and Office files opened (LNK, JumpLists) shortly before the first malicious execution.
    - Exposed services (web servers) with new files in web roots (MFT/USN).

system_info:
  question: What is this computer (name, Windows version, time zone, network, accounts, software)?
  triggers: ['computer.?s? name', 'host ?name', 'time ?zone', '\bbuild\b', 'windows version', '\bos\b', 'operating system', 'user accounts?', 'describe (this|the) (computer|server|machine|host|system)', 'installed (software|programs?)', 'web server software', '\bpatch', 'up to date', 'security updates?', '\bversion\b']
  check:
    - 'Generic.Client.Info cannot describe an image (it asks WMI). Read the registry with Windows.Search.FileFinder, Accessor "registry", one Glob per call (verified on images): HKEY_LOCAL_MACHINE/System/ControlSet001/Control/ComputerName/ComputerName/* (name), HKEY_LOCAL_MACHINE/Software/Microsoft/Windows NT/CurrentVersion/* (ProductName, CurrentBuild), HKEY_LOCAL_MACHINE/System/ControlSet001/Control/TimeZoneInformation/* (TimeZoneKeyName; ActiveTimeBias = minutes to add to local time to get UTC), HKEY_LOCAL_MACHINE/System/ControlSet001/Services/Tcpip/Parameters/Interfaces/*/* (IPAddress, DhcpIPAddress, DhcpDomain), HKEY_LOCAL_MACHINE/Software/Microsoft/Windows NT/CurrentVersion/Winlogon/* and .../Authentication/LogonUI/* (last user).'
    - 'Accounts: Windows.Forensics.SAM (source CreateTimes: when each account was made; source Parsed: RID, LoginCount, LastLoginDate). List every account, built-in ones (Guest, disabled ones) included. Windows.Sys.Users lists profile folders only.'
    - 'Software: HKEY_LOCAL_MACHINE/Software/Microsoft/Windows/CurrentVersion/Uninstall/*/DisplayName (FileFinder, registry), program folders (FileFinder Glob C:/*/ and C:/Program Files*/*), services; with a memory image: pslist, cmdline, svcscan.'
    - 'With a memory image, windows.info gives the OS and capture time, and windows.registry.printkey reads the same keys from memory.'
    - 'Patch level: CurrentBuild.UBR (CurrentVersion) is the last cumulative update. Corroborate with HKEY_LOCAL_MACHINE/Software/Microsoft/Windows/CurrentVersion/Component Based Servicing/Packages/Package_for_RollupFix* (key names carry the build) and the Setup / WindowsUpdateClient event logs (install times). Which month a build is comes from your memory, not the evidence: give the build and say the month needs checking against Microsoft''s update history unless you are sure.'
    - 'Roles: a Component Based Servicing package key exists for every optional feature, installed or not, so it proves nothing. File sharing: LanmanServer Start and its Shares key; RDP: Terminal Server fDenyTSConnections = 0 and type 10 logons.'
    - 'Web server: check every candidate, several can be installed at once: IIS (service W3SVC, C:/inetpub), Apache, alone or inside a bundle that ships it with PHP and a database (C:/*/apache*, C:/Apache*, C:/Program Files*/Apache*), nginx, Tomcat. Program folders at C:/*/ and services show them: name the product or bundle by its folder. The one that serves the site is the one whose access log holds the requests: name it, and the others only as installed.'

web_attack:
  question: How was a web server or web application attacked?
  triggers: ['web ?(site|server|app|application|shell|root|page)', 'http request', 'sql ?i(njection)?\b', '\bxss\b', 'file inclusion', '\blfi\b', '\brfi\b', 'upload', '\bphp\b', '\.aspx?\b', 'injection']
  check:
    - 'Find the web server first, in ONE call: Windows.Search.FileFinder with SearchFilesGlobTable = a list of every candidate log location (C:/inetpub/logs/LogFiles/*/*.log, C:/*/apache*/logs/*, C:/*/*/apache*/logs/*, C:/*/nginx*/logs/*, C:/*/tomcat*/logs/*, C:/Program Files*/*/logs/*). Whatever comes back is the server and its logs; do not assume IIS. With memory, pslist/cmdline show the web server and database processes and their paths.'
    - 'Read the access logs with Generic.Detection.Logs (TargetGlob = the log files found, always a SearchRegex). To find the attacker: requests carrying attack payloads (../ traversal, quotes with SQL keywords such as union|select, <script, command separators such as ;, |, && with a command) and automated-tool user agents; then every request from those client IPs. The first request of each kind dates that stage.'
    - 'Planted files: script files (.php, .asp, .aspx, .jsp, .cgi) in the web root created or changed in the incident window: Windows.NTFS.MFT with PathRegex on the web root and FileRegex on script extensions, or FileFinder on the web root (times, Calculate_Hash). Then grep the access log for each new file name: its first request is its first use, and the query parameters of those requests are the commands sent to it. Files can also be written through SQL injection (INTO OUTFILE / DUMPFILE in a request) and deleted afterwards: grep the log for requests to script files that are no longer on disk.'
    - 'POST bodies are not logged: commands sent by POST are only in memory (strings, windows.memsearch on the web server process and its parent) or visible through their effects.'
    - 'What the attacker did through the server: child processes of the web server (pstree, cmdline), console history (consoles, cmdscan), new or changed accounts (Windows.Forensics.SAM CreateTimes, Security 4720/4732), firewall and remote-access changes.'
    - 'Requests from 127.0.0.1 or ::1 come from the server itself (someone logged on to it), not from a remote client.'

execution:
  question: What ran?
  triggers: ['\bran\b', 'execut', 'launch', 'what (was )?run', 'started by', '\bcommands?\b']
  check:
    - 'Typed commands in memory: consoles / cmdscan read conhost.exe (Windows 7+). On older Windows (no conhost.exe in pslist) they return nothing. Either way, list the command lines in one call: analyze_memory strings with words = the utilities you would expect (localgroup, net user, net+user, netsh, sc create, schtasks, wmic, powershell, certutil, whoami...; web-injected commands are URL-encoded, so single words or both forms); then windows.memsearch with a command found, to see which process held it.'
    - 'Commands sent through a web application: GET parameters are in the access log; POST bodies (injected commands, web shell forms) only in memory - windows.memsearch on the web server process and its parent/control process with words of likely commands, or strings. Search memory before writing that a command cannot be determined.'
    - 'The effects of a command are evidence of it when its text is lost: accounts created (Windows.Forensics.SAM), group changes (4732), firewall or remote-access settings, new services or tasks.'
    - Prefetch (run count, last 8 run times) - strongest single execution source on workstations.
    - Security 4688 (if enabled), Sysmon 1.
    - PowerShell 4104 script blocks, 4103, 400; PSReadline history.
    - 'Amcache and ShimCache: presence of executables (with SHA1 in Amcache); not proof of execution alone on Windows 10 and later. Amcache times are inventory times: several files with the same second were catalogued together, not run.'
    - BAM and UserAssist for per-user last execution; SRUM for per-app activity.

accounts:
  question: Were accounts created, changed or compromised?
  triggers: ['\baccounts?\b.{0,40}(creat|chang|compromis|added|modif)', '(creat|chang|compromis|added|modif)\w*\b.{0,40}\baccounts?\b', 'weak password', 'group membership', 'domain admins', 'new (user|account)']
  check:
    - 'Created: Security 4720 and Windows.Forensics.SAM CreateTimes. Changed: 4722 enabled, 4724 password reset, 4738 changed, 4725 disabled, 4726 deleted, 4781 renamed.'
    - 'Group changes, the step attackers rarely skip: 4732 local group (Administrators, Remote Desktop Users), 4728 global group (Domain Admins), 4756 universal group. MemberSid names the account. One EvtxHunter call with IdRegex for all of these IDs.'
    - 'Who made a change: its SubjectLogonId is a session. search_iocs that number to find the 4624 that opened it (TargetLogonId) with the source IP and logon type. That ties the change to a remote attacker; the account name alone does not.'
    - 'Compromised: successful logons tied to the attacker (source IP and workstation name of the 4624 itself), and accounts their tools used (run-as account of tasks and services, -u/-p or /user: in command lines).'
    - 'Weak passwords: passwords in clear text in task arguments, service command lines, scripts, PSReadline or memory; a success after only a short guessing burst.'

impact:
  question: What did the ransomware or destructive tool do, and how was it started?
  triggers: ['ransom', 'encrypt', '\bwiper\b', '\bimpact\b', 'destroy']
  check:
    - 'Start from what is already known (case_summary findings): the attacker''s sessions and the tasks and services they created. A task or service that starts a program from a user folder names the payload in its command and arguments (get_event_detail on the task record), with the remote targets and credentials.'
    - 'Payload: executables written in the attacker''s session (USN FILE_CREATE, MFT) and what starts them: scheduled tasks, services (7045), PsExec, GPO scripts. Searching for the family name shown on screen rarely finds anything: payloads and notes have other names.'
    - 'Ransom notes: text or HTML files created in many folders at once (USN), or on the desktop; their $SI/$FN times. The note names a family; the family shown on screen can differ: report both, verify neither from memory.'
    - 'Encryption: mass renames to one new extension and FILE_CREATE + DELETE pairs in the USN journal; the first and last of them date it.'
    - 'Recovery blocked: shadow copies or backups deleted (vssadmin, wmic shadowcopy, wbadmin), bcdedit recovery settings changed (Prefetch, 4688, PowerShell 4104, memory), services stopped or disabled (System 7036/7040), logs cleared (1102, 104).'
    - 'Boot-level ransomware (MBR overwrite) leaves little in Windows: no encryption in the USN journal after the last record, and the last boot/shutdown events, are the end of the story; say so.'

persistence:
  question: How does it survive reboot or logon?
  triggers: ['persist', 'surviv', 'reboot', 'autostart', 'run key', 'scheduled task', '\bservices?\b', '(keep|stay)s? running', 'starts? (again|automatically)', 'keep(s|ing)? (their |its )?access', 'maintain(ed)? access', 'foothold']
  check:
    - Run/RunOnce keys and Startup folders (StartupItems).
    - 'Services: System 7045 / Security 4697, SYSTEM hive Services key.'
    - 'Scheduled tasks: Tasks folder, Security 4698, TaskScheduler/Operational 106.'
    - WMI subscriptions (WMI-Activity 5861, repository).
    - New or modified accounts (4720, 4732 to Administrators).

indicator:
  question: Where does this IP, domain, URL or file name appear?
  triggers: ['\b\d{1,3}(\.\d{1,3}){3}\b', '\bip\b', 'ip address', '\bdomain\b', '\burl\b', 'indicator', '\biocs?\b', 'related to', 'relation']
  check:
    - 'Collected data first: search_iocs with the exact value and a shorter part (e.g. the first three octets), then pivot_entity on what it finds.'
    - 'Event logs that record addresses and URLs, in one pass: Windows.EventLogs.EvtxHunter with an IOC regex of the value covers logons (4624/4625 IpAddress), RDP (1149, LocalSessionManager 21/24/25), Defender detections (1116/1117 name the download URL), BITS transfers and PowerShell script blocks.'
    - 'Downloads: the Zone.Identifier stream of the downloaded file (Windows.Analysis.EvidenceOfDownload with its CURRENT path in DirectoryPathGlob) holds HostUrl / ReferrerUrl. Browser history only where the artifact works on images (dfir_guide on it); IE and Edge Legacy keep it in WebCacheV01.dat, which has no parser artifact.'
    - 'Memory image: analyze_memory strings with the value finds it anywhere in RAM, freed memory included, with the text around it (full URL, HTTP request); windows.memsearch with the value names the process that still holds it. netscan only lists connections still in memory, so a netscan miss alone proves little.'
    - 'In the answer, separate real negatives (searched, not there) from checks that could not run on this image (parser needs a live system): only the first kind is evidence of absence.'
    - 'For blocking and hunting, list every source IP of a successful logon tied to the attacker (read from each 4624 / 1149 itself), not only the addresses that failed; accounts they created or used; files and hashes they brought; task and service names.'

browsing:
  question: What did users browse, search for, watch or download?
  triggers: ['brows(e|ed|ing|er)', 'search(ed|es)? (for|on)\b', '\bwatch(ed|ing)?\b', 'web (history|activity|search)', 'visit(ed|s)?\b.{0,30}\b(site|page|url)', '(site|page)s? .{0,20}visit', '\bgoogle', '\byoutube', 'on the (web|internet)']
  check:
    - 'case_summary leads web_searches (the words decoded from search pages, as the user typed them, odd spellings included) and youtube_videos_opened, per user and browser, with times. They cover the collected browser history only.'
    - 'Read each browser''s history whole, not only keyword hits: a history of a few hundred rows costs little to read (query_timeline with source = the history artifact), and keyword searches miss misspellings, other languages and words typed differently than you expect.'
    - 'Every browser the users have: Chrome, Edge and Firefox (Windows.Applications.*), and others seen in Prefetch, UserAssist or program folders (Brave, Opera, Tor Browser). Tor Browser and private windows keep no history: say that instead of "nothing found".'
    - 'For each item give the user (profile), the browser, the time and the words or page title.'
    - 'Downloads: Zone.Identifier (Windows.Analysis.EvidenceOfDownload) and the listing of the users'' Downloads folders.'

account_usage:
  question: Which accounts were used, how often, and which one last?
  triggers: ['used last', '\blast (used|user|account|logged|logon|login|sign)', 'how (many|often)\b.{0,40}\b(log|sign)', '(logon|login) counts?', 'most (recent|active) (user|account)', 'who (used|uses|was using) (this|the) (computer|machine|workstation|laptop)']
  check:
    - 'The registry keeps the machine''s own answers, whatever the event logs still hold: Windows.Forensics.SAM (source Parsed) gives each local account''s LoginCount and LastLoginDate. The last user name at the logon screen is in HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon (LastUsedUsername, DefaultUserName) and ...\Windows\CurrentVersion\Authentication\LogonUI (LastLoggedOnUser, LastLoggedOnSAMUser): Windows.Search.FileFinder with Accessor registry on those keys.'
    - 'Event logs count only what they still hold (they roll over and can be cleared), and every logon type: count the interactive ones (4624 LogonType 2, 10, 11; 7 is an unlock) per account, and say which period the collected logs cover.'
    - 'When the registry and the events disagree, give both numbers, each with its source. Domain accounts are not in the local SAM.'
    - 'Last used: compare the registry''s last user with the latest interactive logon in the events; name both if they differ.'

sessions:
  question: When did someone log on or off, and did they come back?
  triggers: ['log(ged)? ?(on|in|off|out)\b', 'logoff', 'logon', 'session', 'came back', 'come back', 'return(ed)?\b', '\bagain\b', 'reconnect', 'disconnect', 'restart', 'reboot', 'shut ?down']
  check:
    - 'A session is one Logon ID (TargetLogonId): 4624 (logon; LogonType 10 RDP, 2 console, 7 unlock/reconnect, 3 network) -> 4647 (user chose log off) -> 4634 (session ended). Pair them by Logon ID, not by time.'
    - 'RDP (LocalSessionManager): 21 logon, 22 shell start, 24 disconnect, 25 reconnect, 23 logoff; Security 4779 disconnect / 4778 reconnect. A disconnect is not a logoff: the session and its programs (e.g. a backdoor) keep running until 23/4647.'
    - 'Restarts: System 1074 (who asked for the restart and with which program), 6006 clean stop, 6008 unexpected shutdown, 6005 log service start = boot. A restart ends every session; logons after it are new sessions.'
    - 'Did they come back: search the whole period AFTER the logoff up to the end of the evidence (the last records, or the memory capture time) for the same account and the same source IP: 4624 type 10 / 7, 1149, 21, 25, 4778. Check with list_collections that the collected logs cover that period; if not, collect it (e.g. Windows.EventLogs.RDPAuth, or EvtxHunter with these IDs and DateAfter = the logoff time).'
    - 'Name the LAST interactive logoff (the latest 4647 / 4634 of type 2, 10 or 11, or 23) separately from the first one.'

lateral_movement:
  question: Did the attacker move between machines?
  triggers: ['lateral', 'pivot', '\bmove[sd]? (to|between|from)', 'other (host|machine)s?', '\brdp\b', 'remote desktop', 'psexec']
  check:
    - 'Inbound (on the target): 4624 type 3 or 10 with a source IP; 1149; LocalSessionManager 21/22/24/25; 5140 to ADMIN$/C$; 7045 PSEXESVC.'
    - 'Outbound (on the source): 4648 naming the target; RDPClient 1024 / 1102 (the server connected to: search_iocs ''RDPClient'', because a search for the target''s IP is drowned by its inbound logons); Prefetch/JumpLists for mstsc.exe, psexec.exe; Terminal Server Client registry MRU (Windows.Registry.NTUser). Windows Server has Prefetch off by default: no mstsc.exe Prefetch on a server proves nothing.'
    - 'Logons INTO a domain controller from workstations (4624 type 3) are routine: Group Policy, shares, logon scripts. They are not lateral movement unless tied to the attacker (their session, a compromised account used at that time, their tools). Say which direction the movement went.'
    - Match times across both machines (allow for clock skew).

credential_access:
  question: Were credentials stolen?
  triggers: ['credential', 'password', 'lsass', 'mimikatz', 'hash(es)? (dump|stol)', 'kerberos']
  check:
    - Tools in Prefetch/Amcache (mimikatz, procdump, comsvcs.dll MiniDump via rundll32).
    - 'Access to SAM/SECURITY/NTDS.dit copies: USN/MFT for *.dit, *.hive, shadow copy use (vssadmin, ntdsutil in Prefetch/4688).'
    - 4672 privileged logons and 4648 explicit-credential use afterwards.

collection_exfiltration:
  question: Was data gathered or taken?
  triggers: ['exfil', '\bstol(e|en)\b', '\b(take|taken|took)\b', 'leak', 'archive', '\.?\bzip\b', 'upload', 'data (was )?(gathered|collected)', '\bcollect(ed)?\b', 'files? (of interest|accessed|opened)', 'disguis', 'extension', 'hid(e|den|ing)\b.{0,30}\bfiles?']
  check:
    - 'Establish who and from when first. After an intrusion: the attacker''s first logon or execution (case_summary findings); only what happened from then on, or what is tied to the attacker''s session (logon ID, source IP, account at that time), is the attacker''s, and earlier file activity is the owners'' normal use. For an insider: the account whose profile paths, shortcuts and sessions show the activity.'
    - 'Files in the users'' folders: the triage usually lists them (Windows.Search.FileFinder) and types each by its first bytes (Generic.Detection.Yara.Glob, rules FileType_<type>): search those records by name or type (e.g. FileType_zip, FileType_sevenzip, FileType_rar). The case_summary lead files_whose_content_is_not_their_name lists archives or programs saved under another extension or none.'
    - 'Archives created then deleted: USN journal (FILE_CREATE, RENAME, FILE_DELETE) for .zip/.7z/.rar; MFT for surviving entries.'
    - 'Who did it: the user profile in the paths shows the account. A temp file in C:\Users\<name>\AppData\Local\Temp or a Recent\*.lnk under C:\Users\<name> means the action ran as <name>, even when the result lands in another user''s folder. Match it with that account''s logon session (4624/RDP 21) at the time.'
    - Files opened by the attacker's account (LNK, JumpLists, Shellbags) around the intrusion window.
    - 'Give WHEN for each file, next to its name: a Recent\*.lnk is created at the first open and modified at the last open of its target (Windows.Forensics.Lnk: SourceFile.Btime / SourceFile.Mtime; ShellLinkHeader times are the target''s own times); JumpList entries carry their own times; a RecentDocs key''s LastWrite dates only its most recent item. A file listed with no time is half an answer.'
    - 'Volume: SRUM bytes sent per application; cloud sync clients (OneDrive) and browser uploads.'
    - Shares accessed (5140) and Recycle Bin.

anti_forensics:
  question: Did the attacker cover tracks?
  triggers: ['clear(ed)? (the )?logs?', 'timestomp', 'anti.?forensic', '\bwip(e|ed)\b', 'cover(ed)? (their |its )?tracks', 'delet(e|ed) (the )?(logs?|evidence)']
  check:
    - Log clearing (Security 1102, System 104), gaps in event logs.
    - 'Timestomping: first list the files the attacker touched after the intrusion start (USN, LNK in their session), then check each of them; Windows itself changes registry hives and logs, so BASIC_INFO_CHANGE on those is routine. USN BASIC_INFO_CHANGE on a file with no data change at the same moment = its timestamps (or attributes) were set by a program. Then compare that file''s MFT $SI (0x10) and $FN (0x30) times (Windows.NTFS.MFT, FileRegex on its name; SI_Lt_FN, USecZeros): $SI older than $FN, $SI times with zero fractions of a second (USecZeros) that differ from $FN, or times that do not fit its USN history, show the change. Check the files the attacker touched, not a sample; files dropped by malware (notes, payloads) too.'
    - Deletions in the USN journal; secure-delete tools (sdelete, cipher /w) in Prefetch.
    - Disabled logging or Defender (Defender 5001).

timeline_basics:
  question: How to read times correctly?
  triggers: ['timeline', '\bclock\b', 'time ?zone', '\bskew']
  check:
    - Event logs and NTFS store UTC, but derived from the host clock; a mis-set clock shifts everything (see the case clock offset).
    - 'MACB: Modified, Accessed, Changed ($MFT record), Born. $SI times are easy to forge; $FN times are harder.'
    - Prefetch keeps the last 8 run times; earlier runs are only counted.
    - Registry values have no time; the key LastWrite time is the only date.

memory:
  question: What does the memory image show?
  triggers: ['\bmemory\b', 'volatility', 'inject', '\bc2\b', 'command.and.control', 'malfind', 'netscan', '\bpid\b', 'process(es)? (tree|list)', 'connections?\b', 'which process', '\bown(ed|er|s)\b']
  check:
    - 'Start with the memory triage results (list_collections): windows.info gives the capture time; the triage runs pslist, psscan, pstree, cmdline, netscan, svcscan and malfind.'
    - 'Processes: names that imitate system binaries (scvhost.exe), wrong parents (svchost.exe not under services.exe), system binaries outside System32 (cmdline / pstree path), processes in psscan but not pslist without an exit time (hidden).'
    - 'Network (netscan): connections from processes that should not talk to the internet, external IPs on 443/80/8080, listening ports opened by malware. Join on PID with cmdline.'
    - 'Injection (malfind): executable private memory with an MZ header or shellcode, especially in spoolsv.exe, svchost.exe, explorer.exe, lsass.exe; then dlllist/ldrmodules for that PID.'
    - 'Process migration (e.g. Meterpreter migrate): the original malware process exits (psscan exit time) and a system process (often spoolsv.exe) shows malfind hits and the C2 connection.'
    - 'Persistence: svcscan (services with odd binary paths), printkey on Software\Microsoft\Windows\CurrentVersion\Run.'
    - 'Typed commands: consoles / cmdscan; credential theft: handles or dlllist of lsass.exe, processes touching lsass.'
    - 'Correlate with the disk timeline: the process create time (pslist) should match Prefetch/7045/4688 on disk; the C2 IP should appear in the firewall/proxy or other hosts.'
    - 'Always name the parent: search_iocs "PID <ppid>" finds it in the pslist/psscan rows already collected. Not there: analyze_memory windows.psscan with pid [<ppid>] (exited processes stay in memory for a while). contains "<ppid>" also matches the children that list it as PPID, so use pid. explorer.exe means it was started from the desktop (double-click), cmd.exe/powershell.exe a command line, services.exe a service, a browser a download that was opened.'
    - 'A parent found nowhere in memory has exited and been overwritten: write that, then use disk evidence of what ran just before the child (Prefetch, browser artifacts, Zone.Identifier).'
    - 'Narrow heavy plugins (handles, dlllist, filescan, envars) with pid or contains from a lead you already have.'
    - 'Search memory for any IP, domain or file name the collected data does not explain: strings (whole image, with context) and windows.memsearch text=... (which process). The owner of a C2 connection netscan cannot name is usually the process holding the C2 address.'

